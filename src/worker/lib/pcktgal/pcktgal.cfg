SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;

    # Work RAM above stack / ZP ($0200-$07FF); VRAM starts at $0800
    RAM0: file = "", start = $0200, size = $0600, define = yes;

    # Fixed program ROM at $8000-$FFFF
    PRG: file = %O, start = $8000, size = $8000 - 6, fill = yes, define = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;

    # Appended graphics / palette (not in CPU address space)
    CHARS:   file = %O, start = $0, size = $8000, fill = yes, define = yes;
    SPRITES: file = %O, start = $0, size = $4000, fill = yes, define = yes;
    PROMS:   file = %O, start = $0, size = $0400, fill = yes, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    STARTUP:  load = PRG,             type = ro,  define   = yes;
    RODATA:   load = PRG,             type = ro,  define   = yes;
    ONCE:     load = PRG,             type = ro,  optional = yes;
    CODE:     load = PRG,             type = ro,  define   = yes;
    DATA:     load = PRG, run = RAM0, type = rw,  define   = yes;
    VECTORS:  load = VECTORS,         type = ro;
    BSS:      load = RAM0,            type = bss, define   = yes;
    RAM:      load = RAM0,            type = rw,  optional = yes;
    CHARS:    load = CHARS,           type = ro,  optional = yes;
    SPRITES:  load = SPRITES,         type = ro,  optional = yes;
    PROMS:    load = PROMS,           type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
